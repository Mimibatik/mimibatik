<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toko Online</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="fontLink" rel="stylesheet" href="">
<style>
:root{
  --brand:#c2552d; --ink:#1f1a17; --bg:#faf6f0; --card:#fff; --wa:#1ea952;
  --brand-d:color-mix(in srgb,var(--brand) 78%,#000);
  --soft:color-mix(in srgb,var(--brand) 14%,#fff);
  --line:color-mix(in srgb,var(--ink) 11%,var(--bg));
  --muted:color-mix(in srgb,var(--ink) 62%,var(--bg));
  --fh:'Fraunces',serif; --fb:'Plus Jakarta Sans',system-ui,sans-serif;
  --r:16px; --rb:999px; --cols:4; --ratio:1/1; --logo-h:40px;
  --shadow:0 6px 24px color-mix(in srgb,var(--ink) 9%,transparent);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);line-height:1.5}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.h{font-family:var(--fh)}

.announce{background:var(--ink);color:var(--bg);text-align:center;font-size:13px;font-weight:600;padding:8px 16px}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:16px;min-height:68px;padding-top:8px;padding-bottom:8px}
.logo{font-family:var(--fh);font-size:24px;font-weight:700;display:flex;align-items:center;gap:10px;line-height:1.1}
.logo span{color:var(--brand)}
.logo img{height:var(--logo-h);width:auto;max-width:220px;object-fit:contain;border-radius:6px;display:block}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;padding:11px 16px 11px 40px;border:1px solid var(--line);border-radius:var(--rb);background:var(--card);outline:none}
.search input:focus{border-color:var(--brand)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cart-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--rb);background:var(--ink);color:var(--bg);font-weight:600;flex-shrink:0}
.badge{background:var(--brand);color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}

.hero{padding:48px 0 32px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
.hero h1{font-family:var(--fh);font-size:clamp(34px,5vw,56px);line-height:1.08;letter-spacing:-.02em}
.hero h1 em{color:var(--brand);font-style:normal}
.hero p{color:var(--muted);font-size:17px;margin:16px 0 24px;max-width:480px;white-space:pre-line}
.cta{text-decoration:none;display:inline-flex;gap:8px;align-items:center;background:var(--brand);color:#fff;padding:14px 26px;border-radius:var(--rb);font-weight:700}
.cta:hover{background:var(--brand-d)}
.hero-art{aspect-ratio:1.1;border-radius:calc(var(--r)*1.6);background:linear-gradient(140deg,color-mix(in srgb,var(--brand) 35%,#fff),color-mix(in srgb,var(--brand) 70%,#fff) 55%,var(--brand));position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero-art>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-art .promo{position:absolute;left:24px;bottom:24px;background:var(--card);padding:14px 18px;border-radius:var(--r);box-shadow:var(--shadow)}
.promo b{font-family:var(--fh);font-size:26px;color:var(--brand);display:block;line-height:1.1}
.promo small{display:block}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 36px}
.perk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:center;font-size:14px}
.perk i{font-style:normal;width:38px;height:38px;border-radius:calc(var(--r)*.6);background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.perk small{display:block;color:var(--muted)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.bar h2{font-family:var(--fh);font-size:30px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:8px 16px;border-radius:var(--rb);border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.sort{padding:8px 12px;border-radius:calc(var(--r)*.6);border:1px solid var(--line);background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:20px;padding-bottom:60px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.thumb{aspect-ratio:var(--ratio);position:relative;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.thumb svg{width:44%;height:44%;color:rgba(255,255,255,.95);filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.thumb img,.m-img img,.mini img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tag{position:absolute;top:12px;left:12px;background:var(--card);color:var(--brand);font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--rb);z-index:1}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.name{font-weight:600;cursor:pointer}
.rate{font-size:13px;color:var(--muted)}
.rate b{color:#e2a400}
.price{margin-top:auto;padding-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price strong{font-size:18px}
.price s{color:var(--muted);font-size:13px}
.add{margin-top:10px;width:100%;padding:10px;border-radius:calc(var(--r)*.75);background:var(--soft);color:var(--brand-d);font-weight:700}
.add:hover{background:var(--brand);color:#fff}
.empty{grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)}
body.no-rating .rate{display:none}

.overlay{position:fixed;inset:0;background:rgba(20,12,8,.45);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--card);z-index:50;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column}
.drawer.show{transform:none}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--line)}
.d-head h3{font-family:var(--fh);font-size:22px}
.x{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:20px;line-height:1;flex-shrink:0}
.d-body{flex:1;overflow:auto;padding:16px 20px}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.mini{width:64px;height:64px;border-radius:calc(var(--r)*.75);display:grid;place-items:center;flex-shrink:0;position:relative;overflow:hidden}
.mini svg{width:50%;height:50%;color:#fff}
.item .meta{flex:1;font-size:14px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--rb);margin-top:6px}
.qty button{width:28px;height:28px;font-weight:700}
.qty span{min-width:24px;text-align:center;font-weight:600}
.rm{color:var(--muted);font-size:12px;text-decoration:underline;margin-left:10px}
.d-foot{border-top:1px solid var(--line);padding:16px 20px;background:var(--bg)}
.row{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}
.row.total{font-size:18px;font-weight:700;margin-top:8px}
.btn{width:100%;padding:14px;border-radius:calc(var(--r)*.85);font-weight:700;margin-top:12px;background:var(--ink);color:var(--bg)}
.btn.wa{background:var(--wa);color:#fff;display:flex;justify-content:center;gap:8px;align-items:center;text-decoration:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.form label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.form input,.form select,.form textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:calc(var(--r)*.6);outline:none;background:var(--card)}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--brand)}
.err{color:#c0392b;font-size:13px;margin-top:8px;display:none}
.back{font-size:14px;color:var(--muted);text-decoration:underline;margin-bottom:6px}

.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;pointer-events:none;opacity:0;transition:.25s}
.modal.show{opacity:1;pointer-events:auto}
.m-box{background:var(--card);border-radius:calc(var(--r)*1.4);max-width:780px;width:100%;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;max-height:90vh}
.m-img{display:grid;place-items:center;min-height:300px;position:relative;overflow:hidden}
.m-img svg{width:45%;color:#fff}
.m-txt{padding:28px;overflow:auto;position:relative}
.m-txt .x{position:absolute;top:16px;right:16px}
.m-txt h3{font-family:var(--fh);font-size:26px;margin:6px 0;padding-right:40px}
.m-txt p{color:var(--muted);font-size:15px;margin:12px 0;white-space:pre-line}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.opt{padding:6px 14px;border:1px solid var(--line);border-radius:calc(var(--r)*.6);font-size:14px}
.opt.on{border-color:var(--brand);background:var(--soft);color:var(--brand-d);font-weight:600}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;z-index:60;transition:.3s;font-size:14px}
.toast.show{transform:translate(-50%,0)}
footer{background:var(--ink);color:color-mix(in srgb,var(--bg) 80%,var(--ink));padding:40px 0;font-size:14px}
footer .cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px}
footer h4{color:var(--bg);margin-bottom:8px}
footer .logo{color:var(--bg);margin-bottom:10px}
footer a{color:inherit}
.social{display:flex;flex-direction:column;gap:4px;margin-top:6px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-top:24px}
  .hero-art{aspect-ratio:1.8}
  .perks{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .info{padding:10px 12px 12px}
  .price strong{font-size:16px}
  .m-box{grid-template-columns:1fr}
  .m-img{min-height:220px}
  .search{display:none}
  .search.mobile{display:block;max-width:none;margin:0 0 16px}
  footer .cols{grid-template-columns:1fr}
  .cart-btn .lbl{display:none}
  .logo img{max-width:150px}
}
@media (min-width:821px){.search.mobile{display:none}}
</style>
</head>

<div class="announce" id="announce" hidden></div>

<main class="wrap">

        <g transform="translate(130 90)" fill="#fff">

        <option value="low">Harga terendah</option>
        <option value="high">Harga tertinggi</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>
  <div class="wrap cols">
    <div><div class="logo" data-logo></div><p id="footDesc" style="white-space:pre-line"></p></div>
    <div><h4>Kontak</h4><p id="contact"></p></div>
    <div><h4>Ikuti kami</h4><div class="social" id="social"></div></div>
  </div>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Keranjang">
  <div class="d-head"><h3 id="dTitle">Keranjang Belanja</h3><button class="x" data-close aria-label="Tutup">×</button></div>

</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="m-box" id="mBox"></div></div>

(function(){

  if(T.warnaUtama) r.setProperty("--brand", T.warnaUtama);
  if(T.warnaTeks) r.setProperty("--ink", T.warnaTeks);
  if(T.warnaLatar) r.setProperty("--bg", T.warnaLatar);

})();

  $("#contact").innerHTML = `WhatsApp: +${esc(TOKO.whatsapp)}${TOKO.email?`<br>${esc(TOKO.email)}`:""}${TOKO.alamat?`<br>${esc(TOKO.alamat)}`:""}`;
  const so = [["Instagram",link(TOKO.instagram,"https://instagram.com/")],["TikTok",link(TOKO.tiktok,"https://tiktok.com/@")],["Shopee",link(TOKO.shopee,"https://shopee.co.id/")],["Tokopedia",link(TOKO.tokopedia,"https://tokopedia.com/")]].filter(x=>x[1]);
  $("#social").innerHTML = so.length ? so.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${n}</a>`).join("") : `<span>-</span>`;
  if(!so.length) $("#social").parentElement.style.display="none";
})();

/* katalog */
function renderChips(){
  const cats = ["Semua", ...new Set(PRODUK.map(p=>p.kat).filter(Boolean))];
  $("#chips").innerHTML = cats.length>2 ? cats.map(c=>`<button class="chip ${c===filter?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join("") : "";
}
function renderGrid(){
  let list = PRODUK.filter(p => (filter==="Semua"||p.kat===filter) && (p.nama||"").toLowerCase().includes(query));
  if(sortBy==="low") list.sort((a,b)=>a.harga-b.harga);
  else if(sortBy==="high") list.sort((a,b)=>b.harga-a.harga);
  else if(T.urutan !== "manual") list.sort((a,b)=>(b.terjual||0)-(a.terjual||0));
  $("#grid").innerHTML = list.length ? list.map(p=>`
    <article class="card">
      <div class="thumb" data-view="${p.id}" style="${bg(p)}">
        ${p.coret>p.harga?`<span class="tag">-${Math.round((1-p.harga/p.coret)*100)}%</span>`:""}${visual(p)}
      </div>
      <div class="info">
        ${p.kat?`<span class="cat">${esc(p.kat)}</span>`:""}
        <span class="name" data-view="${p.id}">${esc(p.nama)}</span>
        ${p.rating?`<span class="rate"><b>★</b> ${p.rating}${p.terjual?` · ${(+p.terjual).toLocaleString("id-ID")} terjual`:""}</span>`:""}
        <div class="price"><strong>${rp(p.harga)}</strong>${p.coret>p.harga?`<s>${rp(p.coret)}</s>`:""}</div>
        <button class="add" data-view="${p.id}">+ Keranjang</button>
      </div>
    </article>`).join("") : `<div class="empty">Produk tidak ditemukan 😕</div>`;
}

/* detail produk */
let chosen = null;
function openProduct(id){
  const p = PRODUK.find(x=>x.id==id); chosen = vars(p)[0];
  $("#mBox").innerHTML = `
    <div class="m-img" style="${bg(p)}">${visual(p)}</div>
    <div class="m-txt">
      <button class="x" data-close aria-label="Tutup">×</button>
      ${p.kat?`<span class="cat">${esc(p.kat)}</span>`:""}
      <h3>${esc(p.nama)}</h3>
      ${p.rating?`<span class="rate"><b>★</b> ${p.rating}${p.terjual?` · ${(+p.terjual).toLocaleString("id-ID")} terjual`:""}</span>`:""}
      <div class="price"><strong style="font-size:24px">${rp(p.harga)}</strong>${p.coret>p.harga?`<s>${rp(p.coret)}</s>`:""}</div>
      <p>${esc(p.desk)}</p>
      <b style="font-size:14px">Pilih varian</b>
      <div class="opts">${vars(p).map((v,i)=>`<button class="opt ${i?'':'on'}" data-opt="${esc(v)}">${esc(v)}</button>`).join("")}</div>
      <button class="btn" data-addcart="${p.id}">Masukkan Keranjang</button>
    </div>`;
  show("modal");
}

/* keranjang */
function addToCart(id, varian){
  const key = id+"|"+varian;
  const ada = cart.find(c=>c.key===key);
  ada ? ada.qty++ : cart.push({key,id,varian,qty:1});
  save(); toast("Ditambahkan ke keranjang ✓");
}
function save(){ store.set(cart); $("#count").textContent = cart.reduce((s,c)=>s+c.qty,0); if($("#drawer").classList.contains("show")) renderDrawer(); }
const prod = id => PRODUK.find(p=>p.id===id);
const subtotal = () => cart.reduce((s,c)=>s+prod(c.id).harga*c.qty,0);

function renderDrawer(){
  if(step==="cart"){
    $("#dTitle").textContent = "Keranjang Belanja";
    $("#dBody").innerHTML = cart.length ? cart.map(c=>{
      const p = prod(c.id);
      return `<div class="item">
        <div class="mini" style="${bg(p)}">${visual(p)}</div>
        <div class="meta"><b>${esc(p.nama)}</b><br><span style="color:var(--muted)">${esc(c.varian)} · ${rp(p.harga)}</span><br>
          <span class="qty"><button data-dec="${esc(c.key)}" aria-label="Kurangi">−</button><span>${c.qty}</span><button data-inc="${esc(c.key)}" aria-label="Tambah">+</button></span>
          <button class="rm" data-rm="${esc(c.key)}">Hapus</button>
        </div>
        <b style="font-size:14px">${rp(p.harga*c.qty)}</b>
      </div>`}).join("") : `<div class="empty" style="padding:40px 0">Keranjang masih kosong.<br>Yuk pilih produk dulu!</div>`;
    $("#dFoot").innerHTML = `<div class="row total"><span>Subtotal</span><span>${rp(subtotal())}</span></div>
      <button class="btn" id="toCheckout" ${cart.length?"":"disabled"}>Lanjut ke Checkout</button>`;
  } else {
    $("#dTitle").textContent = "Checkout";
    $("#dBody").innerHTML = `<button class="back" id="backCart">← Kembali ke keranjang</button>
      <form class="form" id="coForm" onsubmit="return false">
        <label for="fNama">Nama lengkap</label><input id="fNama" required placeholder="cth. Budi Santoso">
        <label for="fHp">No. WhatsApp</label><input id="fHp" required inputmode="tel" placeholder="08xxxxxxxxxx">
        <label for="fAlamat">Alamat lengkap</label><textarea id="fAlamat" rows="3" required placeholder="Jalan, RT/RW, kelurahan, kecamatan, kota, kode pos"></textarea>
        ${DATA.ongkir.length?`<label for="fKurir">Pengiriman</label>
        <select id="fKurir">${DATA.ongkir.map(o=>`<option value="${esc(o.nama)}">${esc(o.nama)} — ${+o.biaya?rp(o.biaya):"Gratis"}</option>`).join("")}</select>`:""}
        ${(DATA.pembayaran||[]).length?`<label for="fBayar">Metode pembayaran</label>
        <select id="fBayar">${DATA.pembayaran.map(b=>`<option>${esc(b)}</option>`).join("")}</select>`:""}
        <label for="fCatatan">Catatan (opsional)</label><input id="fCatatan" placeholder="cth. warna cadangan, jam kirim">
      </form>`;
    renderTotals();
    if($("#fKurir")) $("#fKurir").onchange = renderTotals;
  }
}
const kurirNow = () => $("#fKurir") ? $("#fKurir").value : "";
function renderTotals(){
  const ong = ONGKIR[kurirNow()]||0;
  $("#dFoot").innerHTML = `
    <div class="row"><span>Subtotal (${cart.reduce((s,c)=>s+c.qty,0)} barang)</span><span>${rp(subtotal())}</span></div>
    ${kurirNow()?`<div class="row"><span>Ongkos kirim</span><span>${ong?rp(ong):"Gratis"}</span></div>`:""}
    <div class="row total"><span>Total</span><span>${rp(subtotal()+ong)}</span></div>
    <div class="err" id="err">Mohon isi nama, nomor WhatsApp, dan alamat dulu ya.</div>
    <a class="btn wa" id="waBtn" href="#" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.5-.3.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
      Pesan via WhatsApp</a>`;
  $("#waBtn").onclick = sendWA;
}
function sendWA(e){
  const nama=$("#fNama").value.trim(), hp=$("#fHp").value.trim(), alamat=$("#fAlamat").value.trim();
  if(!nama||!hp||!alamat){ e.preventDefault(); $("#err").style.display="block"; return; }
  const kurir=kurirNow(), ong=ONGKIR[kurir]||0;
  let msg = `Halo ${TOKO.nama}, saya mau pesan:\n\n`;
  cart.forEach((c,i)=>{ const p=prod(c.id); msg += `${i+1}. ${p.nama} (${c.varian}) x${c.qty} = ${rp(p.harga*c.qty)}\n`; });
  msg += `\nSubtotal: ${rp(subtotal())}\n`;
  if(kurir) msg += `Ongkir (${kurir}): ${ong?rp(ong):"Gratis"}\n`;
  msg += `*Total: ${rp(subtotal()+ong)}*\n\nNama: ${nama}\nNo. HP: ${hp}\nAlamat: ${alamat}`;
  if($("#fBayar")) msg += `\nPembayaran: ${$("#fBayar").value}`;
  const cat=$("#fCatatan").value.trim(); if(cat) msg += `\nCatatan: ${cat}`;
  e.currentTarget.href = `https://wa.me/${String(TOKO.whatsapp).replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`;
  toast("Membuka WhatsApp…");
}

/* util */
function show(id){ $("#overlay").classList.add("show"); $("#"+id).classList.add("show"); }
function hideAll(){ ["overlay","drawer","modal"].forEach(i=>$("#"+i).classList.remove("show")); }
let tt; function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),1800); }

document.addEventListener("click", e=>{
  const t = e.target.closest("button,[data-view]"); if(!t) return;
  const d = t.dataset;
  if(d.cat){ filter=d.cat; renderChips(); renderGrid(); }
  else if(d.view){ openProduct(d.view); }
  else if(d.opt){ chosen=d.opt; document.querySelectorAll(".opt").forEach(o=>o.classList.toggle("on",o===t)); }
  else if(d.addcart){ addToCart(+d.addcart, chosen); hideAll(); }
  else if(d.inc){ cart.find(c=>c.key===d.inc).qty++; save(); }
  else if(d.dec){ const c=cart.find(c=>c.key===d.dec); c.qty--; if(c.qty<1) cart=cart.filter(x=>x!==c); save(); }
  else if(d.rm){ cart=cart.filter(c=>c.key!==d.rm); save(); }
  else if("close" in d){ hideAll(); }
  else if(t.id==="openCart"){ step="cart"; renderDrawer(); show("drawer"); }
  else if(t.id==="toCheckout"){ step="checkout"; renderDrawer(); }
  else if(t.id==="backCart"){ step="cart"; renderDrawer(); }
});
$("#overlay").onclick = hideAll;
$("#modal").onclick = e=>{ if(e.target.id==="modal") hideAll(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") hideAll(); });
["#q","#q2"].forEach(s=>$(s).addEventListener("input", e=>{ query=e.target.value.toLowerCase().trim(); renderGrid(); }));
$("#sort").onchange = e=>{ sortBy=e.target.value; renderGrid(); };
renderChips(); renderGrid(); save();
</script>
</body>
</html>
